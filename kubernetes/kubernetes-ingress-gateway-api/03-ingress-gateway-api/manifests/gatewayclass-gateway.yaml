# Replace the controllerName with the exact value documented by your Gateway API implementation.
# If your platform already provides a GatewayClass, reference that class and omit this object.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: example-gateway-class
spec:
  controllerName: example.net/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: networking-lab
spec:
  gatewayClassName: example-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: app.example.test
      allowedRoutes:
        namespaces:
          from: Same
