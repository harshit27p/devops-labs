apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weighted-demo
  namespace: networking-lab
spec:
  parentRefs:
    - name: public-gateway
  hostnames:
    - app.example.test
  rules:
    - backendRefs:
        - name: demo-v1
          port: 80
          weight: 90
        - name: demo-v2
          port: 80
          weight: 10
