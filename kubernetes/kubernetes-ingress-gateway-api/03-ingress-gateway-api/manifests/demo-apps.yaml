apiVersion: v1
kind: Namespace
metadata:
  name: networking-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-v1
  namespace: networking-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-v1
  template:
    metadata:
      labels:
        app: demo-v1
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0.0
          args: ["-text=demo version 1", "-listen=:8080"]
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: demo-v1
  namespace: networking-lab
spec:
  selector:
    app: demo-v1
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-v2
  namespace: networking-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-v2
  template:
    metadata:
      labels:
        app: demo-v2
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0.0
          args: ["-text=demo version 2", "-listen=:8080"]
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: demo-v2
  namespace: networking-lab
spec:
  selector:
    app: demo-v2
  ports:
    - name: http
      port: 80
      targetPort: http
