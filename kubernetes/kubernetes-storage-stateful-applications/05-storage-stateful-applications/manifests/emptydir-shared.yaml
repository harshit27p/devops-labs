apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo shared-data > /work/message; sleep 3600"]
      volumeMounts:
        - name: scratch
          mountPath: /work
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 5; cat /work/message; sleep 3600"]
      volumeMounts:
        - name: scratch
          mountPath: /work
          readOnly: true
  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 128Mi
