apiVersion: v1
kind: Namespace
metadata:
  name: workloads-lab
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-generator
  namespace: workloads-lab
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "echo 'Scheduled report'; date"]
              resources:
                requests:
                  cpu: 25m
                  memory: 24Mi
                limits:
                  cpu: 100m
                  memory: 48Mi
