apiVersion: v1
kind: Namespace
metadata:
  name: workloads-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-demo
  namespace: workloads-lab
  labels:
    app: probe-demo
spec:
  containers:
    - name: web
      image: nginx:1.27
      ports:
        - name: http
          containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 5
        failureThreshold: 12
      readinessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 5
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 10
        failureThreshold: 3
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
