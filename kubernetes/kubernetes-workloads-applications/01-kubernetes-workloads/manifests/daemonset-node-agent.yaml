apiVersion: v1
kind: Namespace
metadata:
  name: workloads-lab
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: workloads-lab
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo node-agent-active; sleep 60; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
