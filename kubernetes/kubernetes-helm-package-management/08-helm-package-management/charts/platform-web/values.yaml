replicaCount: 2

nameOverride: ""
fullnameOverride: ""

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27.5"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  automount: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: platform-web.example.test
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
