apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-demo
  namespace: config-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-demo
  template:
    metadata:
      labels:
        app: secret-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          env:
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-credentials
                  key: token
