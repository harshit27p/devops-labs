apiVersion: v1
kind: Namespace
metadata:
  name: security-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: security-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: security-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: security-lab
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: security-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
