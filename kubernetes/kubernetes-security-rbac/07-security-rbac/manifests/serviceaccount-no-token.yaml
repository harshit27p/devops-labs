apiVersion: v1
kind: Namespace
metadata:
  name: security-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-no-api
  namespace: security-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: sa-no-api-demo
  namespace: security-lab
spec:
  serviceAccountName: app-no-api
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
